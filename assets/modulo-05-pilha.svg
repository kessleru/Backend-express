<svg xmlns="http://www.w3.org/2000/svg" width="748" height="398" viewBox="0 0 748 398" role="img" aria-label="A pilha de middlewares do Express e o índice i andando de casa em casa a cada next()">
  <title>A pilha de middlewares e o índice</title>
  <desc>Três momentos da mesma requisição. A pilha é sempre a mesma lista de três funções; o que muda é o índice i, que anda uma casa a cada chamada de next(). Os objetos req e res são os mesmos nos três momentos.</desc>

  <rect width="748" height="398" rx="10" fill="#0d1117" stroke="#30363d"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">

    <text x="24" y="30" fill="#7d8590">a mesma requisição, em três momentos</text>

    <!-- ============ MOMENTO 1 : i = 0 ============ -->
    <g transform="translate(24,52)">
      <text x="34" y="12" fill="#79c0ff" font-size="13">i = 0</text>

      <!-- marcador do indice -->
      <g fill="#79c0ff">
        <path d="M0 36 l14 10 l-14 10 z"/>
      </g>
      <rect x="20" y="24" width="182" height="44" rx="6" fill="#1f6feb" fill-opacity="0.22" stroke="#79c0ff"/>
      <text x="32" y="43" fill="#7d8590" font-size="11">pilha[0]</text>
      <text x="32" y="60" fill="#c9d1d9">log</text>

      <rect x="20" y="76" width="182" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="32" y="95" fill="#7d8590" font-size="11">pilha[1]</text>
      <text x="32" y="112" fill="#7d8590">express.json</text>

      <rect x="20" y="128" width="182" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="32" y="147" fill="#7d8590" font-size="11">pilha[2]</text>
      <text x="32" y="164" fill="#7d8590">handler da rota</text>
    </g>

    <!-- seta 1 -> 2 -->
    <g transform="translate(232,52)">
      <line x1="4" y1="98" x2="46" y2="98" stroke="#7ee787" stroke-width="1.5"/>
      <path d="M46 93 l10 5 l-10 5 z" fill="#7ee787"/>
      <text x="6" y="88" fill="#7ee787" font-size="11.5">next()</text>
    </g>

    <!-- ============ MOMENTO 2 : i = 1 ============ -->
    <g transform="translate(296,52)">
      <text x="34" y="12" fill="#79c0ff" font-size="13">i = 1</text>

      <rect x="20" y="24" width="182" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="32" y="43" fill="#7d8590" font-size="11">pilha[0]</text>
      <text x="32" y="60" fill="#484f58">log</text>

      <g fill="#79c0ff">
        <path d="M0 88 l14 10 l-14 10 z"/>
      </g>
      <rect x="20" y="76" width="182" height="44" rx="6" fill="#1f6feb" fill-opacity="0.22" stroke="#79c0ff"/>
      <text x="32" y="95" fill="#7d8590" font-size="11">pilha[1]</text>
      <text x="32" y="112" fill="#c9d1d9">express.json</text>

      <rect x="20" y="128" width="182" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="32" y="147" fill="#7d8590" font-size="11">pilha[2]</text>
      <text x="32" y="164" fill="#7d8590">handler da rota</text>
    </g>

    <!-- seta 2 -> 3 -->
    <g transform="translate(504,52)">
      <line x1="4" y1="98" x2="46" y2="98" stroke="#7ee787" stroke-width="1.5"/>
      <path d="M46 93 l10 5 l-10 5 z" fill="#7ee787"/>
      <text x="6" y="88" fill="#7ee787" font-size="11.5">next()</text>
    </g>

    <!-- ============ MOMENTO 3 : i = 2 ============ -->
    <g transform="translate(568,52)">
      <text x="34" y="12" fill="#79c0ff" font-size="13">i = 2</text>

      <rect x="20" y="24" width="146" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="32" y="43" fill="#7d8590" font-size="11">pilha[0]</text>
      <text x="32" y="60" fill="#484f58">log</text>

      <rect x="20" y="76" width="146" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="32" y="95" fill="#7d8590" font-size="11">pilha[1]</text>
      <text x="32" y="112" fill="#484f58">express.json</text>

      <g fill="#79c0ff">
        <path d="M0 140 l14 10 l-14 10 z"/>
      </g>
      <rect x="20" y="128" width="146" height="44" rx="6" fill="#238636" fill-opacity="0.25" stroke="#7ee787"/>
      <text x="32" y="147" fill="#7d8590" font-size="11">pilha[2]</text>
      <text x="32" y="164" fill="#c9d1d9">handler da rota</text>

      <text x="20" y="192" fill="#7ee787" font-size="11.5">res.json() — acabou</text>
    </g>

    <!-- ============ req e res compartilhados ============ -->
    <g transform="translate(24,280)">
      <rect x="0" y="0" width="700" height="52" rx="6" fill="#161b22" stroke="#f0883e" stroke-dasharray="4 3"/>
      <text x="16" y="22" fill="#ffa657" font-size="12.5">req  ·  res</text>
      <text x="16" y="40" fill="#7d8590" font-size="11.5">os mesmos dois objetos nos três momentos — o que um escreve, o próximo enxerga</text>
    </g>

    <text x="24" y="358" fill="#7d8590" font-size="11.5">Cada next() faz i++ e chama pilha[i]. Ninguém faz i--:</text>
    <text x="24" y="376" fill="#ff7b72" font-size="11.5">se uma função não chama next() nem responde, o i para ali e a requisição nunca termina.</text>

  </g>
</svg>
