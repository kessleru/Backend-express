<svg xmlns="http://www.w3.org/2000/svg" width="748" height="330" viewBox="0 0 748 330" role="img" aria-label="Linha do tempo mostrando que enquanto a requisição A espera o banco, a única thread atende a requisição B">
  <title>O await pausa a função, não a thread</title>
  <desc>Duas requisições numa linha do tempo. A requisição A executa, depois fica esperando o banco por 300ms e volta a executar. Durante essa espera a thread não fica parada: ela atende a requisição B inteira. A faixa de baixo mostra o que a única thread está executando a cada momento.</desc>

  <rect width="748" height="330" rx="10" fill="#0d1117" stroke="#30363d"/>

  <defs>
    <pattern id="espera" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#161b22"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#30363d" stroke-width="3"/>
    </pattern>
  </defs>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">

    <text x="24" y="30" fill="#7d8590" font-size="12.5">duas requisições, uma thread só</text>

    <!-- ============ REQUISIÇÃO A ============ -->
    <text x="24" y="76" fill="#c9d1d9">req A</text>

    <rect x="120" y="60" width="120" height="26" rx="4" fill="#238636" fill-opacity="0.3" stroke="#7ee787"/>
    <text x="180" y="77" fill="#c9d1d9" text-anchor="middle" font-size="11">seu código</text>

    <rect x="240" y="60" width="360" height="26" rx="4" fill="url(#espera)" stroke="#484f58" stroke-dasharray="4 3"/>
    <text x="420" y="77" fill="#7d8590" text-anchor="middle" font-size="11">await consulta ao banco — esperando</text>

    <rect x="600" y="60" width="120" height="26" rx="4" fill="#238636" fill-opacity="0.3" stroke="#7ee787"/>
    <text x="660" y="77" fill="#c9d1d9" text-anchor="middle" font-size="11">continua</text>

    <!-- ============ REQUISIÇÃO B ============ -->
    <text x="24" y="136" fill="#c9d1d9">req B</text>

    <line x1="300" y1="112" x2="300" y2="120" stroke="#79c0ff" stroke-width="1.5"/>
    <text x="300" y="108" fill="#79c0ff" text-anchor="middle" font-size="10.5">chega aqui</text>

    <rect x="300" y="120" width="120" height="26" rx="4" fill="#1f6feb" fill-opacity="0.3" stroke="#79c0ff"/>
    <text x="360" y="137" fill="#c9d1d9" text-anchor="middle" font-size="11">atendida inteira</text>

    <!-- ============ A THREAD ============ -->
    <line x1="24" y1="172" x2="724" y2="172" stroke="#30363d"/>

    <text x="24" y="202" fill="#ffa657">a thread</text>

    <rect x="120" y="186" width="120" height="26" rx="4" fill="#238636" fill-opacity="0.3" stroke="#7ee787"/>
    <text x="180" y="203" fill="#c9d1d9" text-anchor="middle" font-size="11">roda A</text>

    <rect x="240" y="186" width="60" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="270" y="203" fill="#484f58" text-anchor="middle" font-size="10.5">livre</text>

    <rect x="300" y="186" width="120" height="26" rx="4" fill="#1f6feb" fill-opacity="0.3" stroke="#79c0ff"/>
    <text x="360" y="203" fill="#c9d1d9" text-anchor="middle" font-size="11">roda B</text>

    <rect x="420" y="186" width="180" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="510" y="203" fill="#484f58" text-anchor="middle" font-size="10.5">livre</text>

    <rect x="600" y="186" width="120" height="26" rx="4" fill="#238636" fill-opacity="0.3" stroke="#7ee787"/>
    <text x="660" y="203" fill="#c9d1d9" text-anchor="middle" font-size="11">volta pra A</text>

    <!-- ============ EIXO DO TEMPO ============ -->
    <line x1="120" y1="232" x2="720" y2="232" stroke="#30363d"/>
    <g fill="#484f58" font-size="10" text-anchor="middle">
      <line x1="120" y1="228" x2="120" y2="236" stroke="#30363d"/><text x="120" y="250">0ms</text>
      <line x1="240" y1="228" x2="240" y2="236" stroke="#30363d"/><text x="240" y="250">100</text>
      <line x1="420" y1="228" x2="420" y2="236" stroke="#30363d"/><text x="420" y="250">250</text>
      <line x1="600" y1="228" x2="600" y2="236" stroke="#30363d"/><text x="600" y="250">400</text>
      <line x1="720" y1="228" x2="720" y2="236" stroke="#30363d"/><text x="720" y="250">500</text>
    </g>

    <!-- ============ A CONCLUSÃO ============ -->
    <text x="24" y="288" fill="#c9d1d9" font-size="11.5">A função A ficou parada 300ms esperando. A thread não ficou:</text>
    <text x="24" y="306" fill="#7ee787" font-size="11.5">ela atendeu B inteira no meio da espera e voltou para A quando o banco respondeu.</text>

  </g>
</svg>
