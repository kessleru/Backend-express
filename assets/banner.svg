<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Backend do zero — Node.js, Express e TypeScript">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="traco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <clipPath id="corte">
      <rect width="1200" height="380" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#fundo)"/>

  <!-- Profundidade: círculos translúcidos recortados pela borda arredondada. -->
  <g clip-path="url(#corte)" opacity=".07">
    <circle cx="1080" cy="-40" r="230" fill="#38bdf8"/>
    <circle cx="150" cy="400" r="190" fill="#fbbf24"/>
  </g>

  <!-- Barra de destaque à esquerda, na cor de acento do repo. -->
  <rect x="64" y="92" width="4" height="196" rx="2" fill="url(#traco)"/>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="92" y="105" font-size="13" font-weight="600" letter-spacing="2.4" fill="#fbbf24">GUIA DE ESTUDO · EM PORTUGUÊS</text>

    <text x="92" y="163" font-size="46" font-weight="700" fill="#f8fafc">Backend do zero</text>

    <text x="92" y="205" font-size="19" fill="#94a3b8">Node.js 24 · Express 5 · TypeScript 7 · SQLite · Prisma</text>

    <text x="92" y="245" font-size="16" fill="#cbd5e1">Teoria densa, código que roda e um exercício por módulo.</text>

    <!-- Pills: os três estados do fluxo de estudo. -->
    <g font-size="13" font-weight="600">
      <rect x="92" y="266" width="112" height="30" rx="15" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".45"/>
      <text x="148" y="286" text-anchor="middle" fill="#fcd34d">20 módulos</text>

      <rect x="216" y="266" width="128" height="30" rx="15" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".40"/>
      <text x="280" y="286" text-anchor="middle" fill="#7dd3fc">14 já escritos</text>

      <rect x="356" y="266" width="146" height="30" rx="15" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".40"/>
      <text x="429" y="286" text-anchor="middle" fill="#86efac">113 testes passando</text>
    </g>
  </g>

  <!-- Painel à direita: o caminho de uma requisição pelas camadas do curso. -->
  <g filter="url(#sombra)">
    <rect x="700" y="60" width="436" height="260" rx="14" fill="#0b1220" stroke="#334155"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="700" y="60" width="436" height="38" rx="14" fill="#111c30"/>
    <rect x="700" y="84" width="436" height="14" fill="#111c30"/>
    <line x1="700" y1="98" x2="1136" y2="98" stroke="#334155"/>
    <text x="722" y="85" font-size="13" fill="#7dd3fc">GET</text>
    <text x="756" y="85" font-size="13" fill="#e2e8f0">/api/v1/livros/42</text>

    <g font-size="12.5">
      <!-- Cada linha é uma camada real do currículo, na ordem em que o módulo entra. -->
      <circle cx="726" cy="127" r="3.5" fill="#64748b"/>
      <text x="742" y="131" fill="#cbd5e1">helmet · cors · rate limit</text>
      <text x="1114" y="131" text-anchor="end" fill="#64748b">13</text>

      <circle cx="726" cy="155" r="3.5" fill="#64748b"/>
      <text x="742" y="159" fill="#cbd5e1">pino · x-request-id</text>
      <text x="1114" y="159" text-anchor="end" fill="#64748b">14</text>

      <circle cx="726" cy="183" r="3.5" fill="#64748b"/>
      <text x="742" y="187" fill="#cbd5e1">zod.parse(req.params)</text>
      <text x="1114" y="187" text-anchor="end" fill="#64748b">07</text>

      <circle cx="726" cy="211" r="3.5" fill="#64748b"/>
      <text x="742" y="215" fill="#cbd5e1">controller → service</text>
      <text x="1114" y="215" text-anchor="end" fill="#64748b">08</text>

      <circle cx="726" cy="239" r="3.5" fill="#64748b"/>
      <text x="742" y="243" fill="#cbd5e1">repository → Prisma</text>
      <text x="1114" y="243" text-anchor="end" fill="#64748b">10</text>
    </g>

    <line x1="700" y1="266" x2="1136" y2="266" stroke="#334155"/>
    <text x="722" y="296" font-size="13" font-weight="600" fill="#4ade80">200 OK</text>
    <text x="790" y="296" font-size="12.5" fill="#64748b">·  4 ms  ·  x-request-id: b93670e6</text>
  </g>
</svg>
